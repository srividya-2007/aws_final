spring.application.name=ecogrid-api-gateway
server.port=8080

# JWT
jwt.secret=ecogrid-super-secret-key-that-is-at-least-256-bits-long-for-hs256

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://ecogrid-auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=prosumer-service
spring.cloud.gateway.routes[1].uri=lb://ecogrid-prosumer-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/prosumers/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

spring.cloud.gateway.routes[2].id=telemetry-service
spring.cloud.gateway.routes[2].uri=lb://ecogrid-telemetry-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/telemetry/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

spring.cloud.gateway.routes[3].id=matching-service
spring.cloud.gateway.routes[3].uri=lb://ecogrid-matching-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/matching/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

spring.cloud.gateway.routes[4].id=settlement-service
spring.cloud.gateway.routes[4].uri=lb://ecogrid-settlement-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/settlements/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter

logging.level.org.springframework.cloud.gateway=DEBUG

# CORS — allow React frontend (Vite dev server)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
